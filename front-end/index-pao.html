<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pao Tienda</title>
  <style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
}

header {
  background: #111;
  color: white;
  padding: 10px;
  text-align: center;
}

header input {
  margin-top: 10px;
  padding: 8px;
  width: 60%;
  border-radius: 5px;
  border: none;
}

.container {
  display: flex;
}

/* Sidebar */
aside {
  width: 200px;
  background: white;
  padding: 10px;
  border-right: 1px solid #ddd;
}

aside div {
  padding: 8px;
  cursor: pointer;
}

aside div:hover {
  background: #eee;
}

/* Productos */
main {
  flex: 1;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-body {
  padding: 10px;
}

.price {
  color: green;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
  <h1>🛒 Pao Tienda</h1>
  <input type="text" id="search" placeholder="Buscar productos...">
</header>

<div class="container">
  <!-- Sidebar -->
  <aside id="categories"></aside>

  <!-- Productos -->
  <main>
    <div id="products" class="grid"></div>
  </main>
</div>

<script>
  const API_URL = "https://jm150qvg-8000.usw3.devtunnels.ms/api/products-grouped/";

let allData = {};
let currentCategory = null;

// 🚀 Cargar datos
fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    allData = data;

    renderCategories(data);
    renderProducts(Object.values(data).flat());
  });

// 🧭 Categorías
function renderCategories(data) {
  const container = document.getElementById("categories");
  container.innerHTML = "";

  Object.keys(data).forEach(category => {
    const item = document.createElement("div");
    item.textContent = category;

    item.onclick = () => {
      currentCategory = category;
      renderProducts(data[category]);
    };

    container.appendChild(item);
  });
}

// 🧱 Render productos
function renderProducts(products) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.image}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="price">$${p.price}</p>
      </div>
    `;

    container.appendChild(card);
  });
}

// 🔍 Buscador
document.getElementById("search").addEventListener("input", e => {
  const text = e.target.value.toLowerCase();

  let products = currentCategory
    ? allData[currentCategory]
    : Object.values(allData).flat();

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(text)
  );

  renderProducts(filtered);
});
</script>
</body>
</html>
