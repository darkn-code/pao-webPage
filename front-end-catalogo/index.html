<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Personalizados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="catalog-header">
        <img class="brand-logo" src="./img/LOGO%20PH.png" alt="Creaciones PH">

        <div class="header-title">
            <h1>PRODUCTOS INDIVIDUALES</h1>
            <h2>PERSONALIZADOS</h2>
        </div>

        <div class="mother-day">
            <p>Dia de la</p>
            <strong>Madre</strong>
            <span>CATALOGO DE REGALOS</span>
        </div>
    </header>

    <section class="container">
        <div id="products-grid" class="grid">
            <p class="status">Cargando productos...</p>
        </div>
    </section>

    <script src="./js/catalogo.js"></script>
</body>
</html>
